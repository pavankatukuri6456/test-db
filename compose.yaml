services:
  postgres:
    image: postgres:16-alpine
    container_name: db-connect-demo-postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER_FILE: /run/secrets/db-username
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    ports:
      - "127.0.0.1:55433:5432"
    secrets:
      - db-username
      - db-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$(cat /run/secrets/db-username)" -d appdb
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

secrets:
  db-username:
    file: ./secrets/db-username.txt
  db-password:
    file: ./secrets/db-password.txt

volumes:
  postgres-data:
