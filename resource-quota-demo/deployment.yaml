apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-demo
  namespace: resource-quota-demo
  labels:
    app.kubernetes.io/name: quota-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: quota-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quota-demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -c
          args:
            - |
              echo "quota demo pod started"
              while true; do
                sleep 30
              done
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
